format_version: 2

experiment:
  name: stage13_r0_o3_amp_split42_train123
  output_dir: outputs/advanced/stage13/r0_o3_amp/split_42__train_123
  run_type: formal

randomness:
  split_seed: 42
  train_seed: 123

device: auto

data:
  data_dir: data
  batch_size: 128
  num_workers: 0
  augmentation: basic

model:
  name: minivit
  image_size: 32
  in_channels: 3
  num_classes: 10
  patch_size: 4
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_dim: 768
  dropout: 0.1

training:
  epochs: 100
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.05
  scheduler:
    name: warmup_cosine
    warmup_epochs: 5
    start_factor: 0.1
    min_factor: 0.1
  gradient_clip_norm: 1.0
  amp: true
  label_smoothing: 0.0
  batch_mixing:
    name: none
