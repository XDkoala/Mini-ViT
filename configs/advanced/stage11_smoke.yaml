format_version: 2

experiment:
  name: stage11_optimization_smoke
  output_dir: outputs/advanced/smoke/stage11_optimization/split_42__train_123

randomness:
  split_seed: 42
  train_seed: 123

device: auto

data:
  data_dir: data
  batch_size: 32
  num_workers: 0
  augmentation: basic

# 使用较小但结构完整的 MiniViT；smoke 验证训练栈，不比较准确率。
model:
  name: minivit
  image_size: 32
  in_channels: 3
  num_classes: 10
  patch_size: 4
  embed_dim: 48
  depth: 2
  num_heads: 4
  mlp_dim: 96
  dropout: 0.1

training:
  epochs: 2
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.05
  scheduler:
    name: warmup_cosine
    warmup_epochs: 1
    start_factor: 0.1
    min_factor: 0.1
  gradient_clip_norm: 1.0
  amp: true
